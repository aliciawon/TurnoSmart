<link rel="stylesheet" href="{{ url_for('static', filename='css/panel-jefatura.css') }}">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<h1>Panel de Jefatura</h1>

<p>Bienvenido al área de administración de TurnoSmart.</p>

<div class="contenedor-botones">

    <!-- Trabajadores -->
    <a href="{{ url_for('jefatura.jefatura_trabajadores') }}" id="trabajadores">
        <i class="bi bi-people-fill"></i>
        <span>Trabajadores</span>
    </a>

    <!-- Planificación -->
    <a href="{{ url_for('jefatura.planificacion') }}" id="planificacion">
        <i class="bi bi-calendar3"></i>
        <span>Planificación</span>
    </a>

    <!-- Horas extras -->
    <button type="button" id="horas-extras">
        <i class="bi bi-clock-history"></i>
        <span>Horas Extras</span>
    </button>

    <!-- Disponibilidad -->
    <a href="{{ url_for('jefatura.disponibilidad') }}" id="disponibilidad">
        <i class="bi bi-calendar-check"></i>
        <span>Disponibilidad</span>
    </a>

    <!-- Reporte -->
    <button type="button" id="reporte">
        <i class="bi bi-bar-chart-fill"></i>
        <span>Reporte</span>
    </button>

    <!-- Configuración -->
    <a href="{{ url_for('jefatura.configuracion') }}" id="configuracion">
        <i class="bi bi-gear-fill"></i>
        <span>Configuración</span>
    </a>

</div>

<!-- Cerrar sesión -->
<form action="{{ url_for('cerrar_sesion') }}" method="POST">
    <button type="submit" id="cerrar-sesion">
        <i class="bi bi-box-arrow-right"></i>
        <span>Cerrar Sesión</span>
    </button>
</form>
