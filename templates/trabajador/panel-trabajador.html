<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Panel Trabajador - TurnoSmart</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/panel-trabajador.css') }}">

</head>

<body>

    <h2>Panel del Trabajador</h2>

    <div class="contenedor-panel">

            <i class="bi bi-calendar-week"></i>

        </a>

        <a href="{{ url_for('trabajador.horas_extras') }}">

</a>

<a href="{{ url_for('trabajador.mis_postulaciones') }}">

    <i class="bi bi-list-check"></i>

</a>

    </div>

    <form action="{{ url_for('cerrar_sesion') }}"

        <button type="submit" class="btn-salir">

        </button>

    </form>
