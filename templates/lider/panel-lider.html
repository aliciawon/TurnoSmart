<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Panel Líder - TurnoSmart</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/panel-lider.css') }}">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

<body>

    <h1>TurnoSmart</h1>

    <h2>Panel del Líder</h2>

    <p>Bienvenido, {{ session['correo'] }}</p>

    <div class="contenedor-panel">

        <a href="{{ url_for('trabajador.mi_rol') }}">

            <i class="bi bi-calendar-week"></i>
            <span>Mi rol mensual</span>

        </a>

        <a href="{{ url_for('lider.publicar_cupo') }}">

            <i class="bi bi-calendar-plus"></i>
            <span>Publicar horas extras</span>

        </a>

        <a href="{{ url_for('lider.horas_extras') }}">

            <i class="bi bi-clock-history"></i>
            <span>Mis cupos publicados</span>

        </a>

        <a href="{{ url_for('lider.postulaciones') }}">

            <i class="bi bi-people"></i>
            <span>Gestionar postulaciones</span>

        </a>

    </div>

    <form method="POST"
          action="{{ url_for('cerrar_sesion') }}">

        <button type="submit" class="btn-salir">
            Cerrar sesión
        </button>

    </form>

</body>

</html>
